
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner QR Perpustakaan</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8"></script>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  padding: 12px;
  background: #f1f5f9;
  color: #1e293b;
}

.container {
  max-width: 650px;
  width: 100%;
  margin: 15px auto;
  padding: 20px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

h2 {
  text-align: center;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 15px 0;
}

button, select {
  padding: 12px;
  border: 0;
  border-radius: 7px;
  font-size: 14px;
}

button {
  background: #2563eb;
  color: white;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

.success {
  background: #16a34a;
}

.danger {
  background: #dc2626;
}

select {
  width: 100%;
  border: 1px solid #cbd5e1;
  background: white;
  margin: 8px 0;
}

#reader {
  width: 100%;
  min-height: 250px;
  margin: 15px auto;
  overflow: hidden;
  border-radius: 10px;
  background: #111827;
}

/* Tampilan video kamera */
#reader video {
  width: 100% !important;
  max-width: 100% !important;
  height: auto !important;
  object-fit: contain !important;
  display: block;
}

#reader img {
  max-width: 100%;
}

#status {
  padding: 12px;
  background: #eff6ff;
  border-radius: 7px;
  text-align: center;
  margin: 12px 0;
  font-size: 14px;
}

#result {
  padding: 14px;
  background: #f8fafc;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  min-height: 45px;
  overflow-wrap: anywhere;
}

.hint {
  color: #64748b;
  font-size: 13px;
  line-height: 1.5;
}

@media(max-width:480px) {
  body {
    padding: 5px;
  }

  .container {
    padding: 14px;
    margin: 5px auto;
  }

  button {
    flex: 1;
    min-width: 100px;
  }
}
</style>
</head>

<body>

<div class="container">

<h2>📚 Scanner QR Perpustakaan</h2>

<p class="hint">
Pilih jenis QR yang ingin dipindai.
Pastikan browser sudah mendapatkan izin kamera.
</p>

<div class="buttons">
  <button onclick="pilihMode('anggota')">
    Scan Anggota
  </button>

  <button onclick="pilihMode('buku')">
    Scan Buku
  </button>

  <button onclick="pilihMode('kembali')">
    Pengembalian
  </button>
</div>

<label for="camera"><b>Pilih Kamera:</b></label>

<select id="camera">
  <option value="">Otomatis (Kamera Belakang)</option>
</select>

<div class="buttons">
  <button onclick="muatKamera()">
    Muat Kamera
  </button>

  <button class="success" onclick="mulaiScanner()">
    Buka Kamera
  </button>

  <button class="danger" onclick="matikanScanner()">
    Matikan Kamera
  </button>
</div>

<div id="status">
Status: Kamera belum aktif
</div>

<div id="reader"></div>

<h3>Hasil Scan:</h3>

<div id="result">
Belum ada QR yang dipindai.
</div>

<div class="buttons">
  <button onclick="salinHasil()">
    Salin Hasil
  </button>

  <button class="success" onclick="kirimUlang()">
    Kirim Hasil
  </button>
</div>

<p class="hint">
Tips: Gunakan kamera belakang HP untuk hasil pemindaian
yang lebih mudah. Pastikan QR berada di dalam kotak scanner.
</p>

</div>

<script>

let scanner = null;
let kameraAktif = false;
let modeAktif = 'anggota';
let hasilScan = '';
let sedangMemproses = false;

const cameraSelect = document.getElementById('camera');
const statusBox = document.getElementById('status');
const resultBox = document.getElementById('result');

function status(teks) {
  statusBox.textContent = teks;
}

// PILIH MODE SCAN
function pilihMode(mode) {

  modeAktif = mode;

  const nama = {
    anggota: 'Scan Anggota',
    buku: 'Scan Buku',
    kembali: 'Pengembalian'
  };

  status('Mode aktif: ' + nama[mode]);
}

// MEMUAT DAFTAR KAMERA
async function muatKamera() {

  try {

    if (!window.isSecureContext) {
      throw new Error('Website harus menggunakan HTTPS.');
    }

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      throw new Error('Browser tidak mendukung kamera.');
    }

    status('Meminta izin kamera...');

    // Izin kamera diperlukan agar nama perangkat terbaca.
    const stream = await navigator.mediaDevices.getUserMedia({
      video: true
    });

    stream.getTracks().forEach(track => track.stop());

    const cameras = await Html5Qrcode.getCameras();

    if (!cameras || cameras.length === 0) {
      throw new Error('Kamera tidak ditemukan.');
    }

    cameraSelect.innerHTML =
      '<option value="">Otomatis (Kamera Belakang)</option>';

    cameras.forEach((cam, index) => {

      const option = document.createElement('option');

      option.value = cam.id;
      option.textContent =
        cam.label || 'Kamera ' + (index + 1);

      cameraSelect.appendChild(option);

    });

    // Prioritaskan kamera belakang
    const belakang = cameras.find(cam =>
      /back|rear|environment|belakang/i.test(cam.label)
    );

    if (belakang) {
      cameraSelect.value = belakang.id;
    }

    status('Kamera ditemukan: ' + cameras.length);

  } catch (err) {

    status('Gagal memuat kamera: ' + err.message);

  }
}

// MEMULAI SCANNER
async function mulaiScanner() {

  if (kameraAktif) {
    await matikanScanner();
  }

  try {

    if (!window.isSecureContext) {
      throw new Error('Gunakan website melalui HTTPS.');
    }

    if (!scanner) {
      scanner = new Html5Qrcode('reader');
    }

    sedangMemproses = false;

    status('Mengaktifkan kamera...');

    // Jika pengguna memilih kamera tertentu
    // gunakan ID kamera tersebut.
    // Jika tidak, gunakan kamera belakang.
    const pilihanKamera = cameraSelect.value
      ? cameraSelect.value
      : { facingMode: 'environment' };

    await scanner.start(

      pilihanKamera,

      {
        fps: 10,

        qrbox: function(width, height) {

          const ukuran = Math.min(
            width * 0.8,
            height * 0.8,
            280
          );

          return {
            width: Math.floor(ukuran),
            height: Math.floor(ukuran)
          };

        }

      },

      // KETIKA QR BERHASIL DIBACA
      async function(decodedText) {

        if (sedangMemproses) return;

        sedangMemproses = true;

        hasilScan = decodedText;

        resultBox.textContent = decodedText;

        status('QR berhasil dibaca!');

        await matikanScanner();

        kirimHasil();

      },

      // Frame tanpa QR diabaikan
      function(errorMessage) {}

    );

    kameraAktif = true;

    status('Kamera aktif. Arahkan QR ke kamera.');

  } catch (err) {

    kameraAktif = false;

    status('Kamera gagal dibuka: ' + err.message);

  }

}

// MEMATIKAN KAMERA
async function matikanScanner() {

  if (scanner && kameraAktif) {

    try {

      await scanner.stop();

      kameraAktif = false;

      status('Kamera berhasil dimatikan.');

    } catch (err) {

      kameraAktif = false;

      status('Gagal mematikan kamera: ' + err.message);

    }

  }

}

// MENGIRIM HASIL SCAN KE HALAMAN PEMBUKA
function kirimHasil() {

  if (!hasilScan) return;

  const data = {
    type: 'PERPUS_QR_SCAN',
    target: modeAktif,
    value: hasilScan
  };

  if (window.opener && !window.opener.closed) {

    window.opener.postMessage(data, '*');

    status('Hasil scan dikirim ke aplikasi utama.');

  } else {

    status('QR terbaca. Hasil dapat disalin.');

  }

}

// KIRIM ULANG
function kirimUlang() {

  if (!hasilScan) {
    alert('Belum ada hasil scan!');
    return;
  }

  kirimHasil();

}

// SALIN HASIL
async function salinHasil() {

  if (!hasilScan) {
    alert('Belum ada hasil scan!');
    return;
  }

  try {

    await navigator.clipboard.writeText(hasilScan);

    alert('Hasil scan berhasil disalin!');

  } catch (err) {

    alert('Gagal menyalin hasil scan.');

  }

}

// MEMBERSIHKAN KAMERA SAAT HALAMAN DITUTUP
window.addEventListener('pagehide', function() {

  if (scanner && kameraAktif) {
    scanner.stop();
  }

});

</script>

</body>
</html>
